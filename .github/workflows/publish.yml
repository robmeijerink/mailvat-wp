name: Publish plugin to WordPress.org

on:
  push:
    tags:
    - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Move files before publishing
        run: |
          mv README.md src/

      - name: WordPress Plugin Deploy
        uses: nk-o/action-wordpress-plugin-deploy@99c3fd60a0d5346875049f7da4c107f8bb5a4e1f # master, 2021-10-03
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          ASSETS_DIR: assets/
          SOURCE_DIR: src/
          SLUG: mailvat

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Take the lines under "### <version>" up to the next heading.
          awk -v heading="### ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^##/ { exit }
            found { print }
          ' src/README.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No changelog entry found for ${VERSION} in README.md"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
